# ============================================================
#  ORA — Vérification puis déploiement en production
#
#  À chaque push sur main :
#    1. « Vérifications » : le backend démarre, le frontend se construit
#    2. « Déploiement »   : attend votre validation (environnement
#       "production"), puis lance deploy/update.sh sur le serveur
#
#  Secrets GitHub nécessaires (Settings → Secrets and variables → Actions) :
#    DEPLOY_SSH_KEY      clé privée dédiée au déploiement
#    DEPLOY_KNOWN_HOSTS  empreinte du serveur (ssh-keyscan)
# ============================================================
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour relancer à la main

# Un seul déploiement à la fois ; un nouveau push n'annule pas celui en cours
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ora_backend/requirements.txt

      - name: Dépendances backend
        run: pip install -r ora_backend/requirements.txt

      - name: Le backend démarre sans erreur
        working-directory: ora_backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend_ora/package-lock.json

      - name: Le frontend se construit
        working-directory: frontend_ora
        run: |
          npm install
          npm run build

  deploy:
    name: Déploiement en production
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production          # validation manuelle configurée sur GitHub
      url: https://objectifreussirapprentissage.eu
    steps:
      - name: Lancer la mise à jour sur le serveur
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # La clé est limitée côté serveur à la seule commande update.sh
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@objectifreussirapprentissage.eu
