# Jails ORA — bannissement via UFW (déjà actif, voir setup_vps.sh).
# Le jail [sshd] est déjà activé par défaut par le paquet fail2ban sur
# Ubuntu/Debian (/etc/fail2ban/jail.d/defaults-debian.conf) — rien à
# ajouter pour protéger SSH.

[ora-login]
enabled  = true
port     = http,https
filter   = ora-login
logpath  = /var/log/nginx/access.log
maxretry = 5
findtime = 300
bantime  = 3600
action   = ufw

[ora-admin-login]
enabled  = true
port     = http,https
filter   = ora-admin-login
logpath  = /var/log/nginx/access.log
maxretry = 8
findtime = 300
bantime  = 3600
action   = ufw
