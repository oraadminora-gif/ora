# Django admin ne renvoie pas de code d'erreur distinct sur un mauvais
# mot de passe (toujours 200) : on bannit donc sur le VOLUME de tentatives
# de connexion, peu importe le résultat — un usage normal ne poste
# jamais /shams/login/ plusieurs fois en quelques minutes.
[Definition]
failregex = ^<HOST> -.*"POST /shams/login/ HTTP/\d\.\d"
ignoreregex =
